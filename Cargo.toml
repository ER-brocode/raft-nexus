[package]
name = "raft-nexus"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Multi-Raft Distributed Consensus & Transactional Distributed Key-Value Fabric"
license = "Apache-2.0"
repository = "https://github.com/ER-brocode/raft-nexus"
readme = "README.md"
keywords = ["raft", "consensus", "multi-raft", "distributed-systems", "key-value"]
categories = ["database-implementations", "concurrency", "network-programming"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
crc32fast = "1.4"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "nexus-server"
path = "src/bin/nexus_server.rs"

[[bin]]
name = "nexus-cli"
path = "src/bin/nexus_cli.rs"

[lib]
name = "raft_nexus"
path = "src/lib.rs"
